name: build-and-test
run-name: Initiated by ${{ github.actor }} for commit ${{ github.sha }}
on:
  pull_request:
    types:
      - synchronize
      - reopened
      - opened
jobs:
  for-common:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [18.16.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install yarn
        run: npm install -g yarn
      - name: yarn install
        run: yarn install
      - name: yarn install in demos/common
        run: yarn install
        working-directory: demos/common
      - name: build ownd-vci and demos/common
        run: npm run build
      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            demos/common/dist/
      - name: yarn test
        run: yarn test
      - name: prettier
        run: yarn lint:prettier
      - name: eslint
        run: yarn lint
