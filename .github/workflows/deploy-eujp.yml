name: Deploy to AWS (EUJP)

on:
  push:
    branches:
      - feature/eujp-codedeploy

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create source archive
        run: |
          zip -r source.zip . -x '.git/*' -x '.github/*' -x 'node_modules/*'

      - name: Upload to S3
        run: |
          aws s3 cp source.zip s3://${{ secrets.S3_BUCKET }}/vci/source.zip

      - name: Start CodePipeline
        run: |
          aws codepipeline start-pipeline-execution --name ${{ secrets.PIPELINE_NAME }}
